[project]
name = "reaction-diffusion"
version = "0.1.0"
description = "Simulations, metrics and figures for colorectal pit-pattern progression (Type I -> IIIL -> IV_B -> IV_V)"
authors = [
    { name = "MIZUGUCHI Yasuhiko", email = "mizugy@gmail.com" }
]
dependencies = [
    "pygame>=2.5.2",
    "pygame-gui>=0.6.14",
    "numpy>=1.26.4",
    "opencv-python>=4.9.0.80",
    "pillow>=10.0",
    "imageio[ffmpeg]>=2.31",
    "numba>=0.68.0",
    "scipy>=1.15.3",
]
requires-python = ">= 3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.rye]
managed = true
dev-dependencies = [
    "pytest>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pitpattern"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
